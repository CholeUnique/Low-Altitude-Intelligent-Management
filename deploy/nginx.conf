# Include this server block under nginx.conf's http {}.
# Copy dist/ contents to /usr/share/nginx/html (or change root below).
server {
    listen 38081;
    server_name 58.213.29.196;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 512m;

    location /api/ {
        # No trailing slash: preserve /api/v1/... in the upstream request.
        proxy_pass http://58.213.29.196:38080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
